[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorit-migrator"
version = "1.0.0"
description = "Migración T-SQL a PostgreSQL con evidencia de equivalencia"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1", "uvicorn==0.41.0", "jinja2==3.1.6",
  "typer==0.24.1", "pydantic==2.12.5", "python-dotenv==1.2.2",
  "openai==2.26.0", "pymssql==2.3.13", "psycopg[binary]==3.3.3",
  "pglast==7.12", "filelock==3.25.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.15.5"]

[project.scripts]
migrator = "migrator.cli:app"

[tool.setuptools.packages.find]
include = ["migrator*"]

[tool.setuptools.package-data]
migrator = ["templates/*.html", "static/*", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local Docker database engines"]

[tool.ruff]
line-length = 100
